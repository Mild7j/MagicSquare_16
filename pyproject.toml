[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magicsquare"
version = "0.1.0"
description = "Magic Square 4x4 TDD practice project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
gui = [
    "PyQt6>=6.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "boundary*"]

[tool.pytest.ini_options]
pythonpath = ["."]
